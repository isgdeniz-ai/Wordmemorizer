name: Hikaye Sesi Üret

on:
  workflow_dispatch:
    inputs:
      hikaye:
        description: 'Hangi hikaye? (kimlik, örn. ai-podcast). Boş bırakırsan tümü.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  seslendir:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Kutuphaneleri kur
        run: pip install --quiet google-auth requests

      - name: Kimlik dosyasini yaz
        env:
          ANAHTAR: ${{ secrets.GCP_TTS_KEY }}
        run: printf '%s' "$ANAHTAR" > /tmp/gcp-key.json

      - name: Sesleri uret
        env:
          HIKAYE: ${{ inputs.hikaye }}
        run: |
          python3 - <<'PY'
          import json, os, base64, struct, subprocess, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          # ============================================================
          # KARAKTER SESLERI
          #   Sabit ad yazabilirsin:  "en-US-Studio-Q"
          #   Ya da otomatik sec:     ("Chirp3-HD", "FEMALE", 0)
          #     -> hesapta bulunan Chirp3-HD kadin seslerinden 0. sirada olan
          #   Otomatik secim, ses adlari degisse bile calismaya devam eder.
          # ============================================================
          SESLER = {
              # hikaye anlaticilari
              "anlatici": "en-US-Studio-Q",
              "mia":      ("Chirp3-HD", "FEMALE", 0),
              "vance":    "en-US-Chirp3-HD-Algieba",

              # yapay zeka sohbeti
              "emma":     ("Chirp3-HD", "FEMALE", 1),
              "sam":      ("Chirp3-HD", "MALE",   0),

              # ingilizce ogrenme sohbeti
              "alex":     ("Chirp3-HD", "MALE",   1),
              "sarah":    ("Chirp3-HD", "FEMALE", 2),
              "david":    "en-US-Chirp3-HD-Algieba",

              # iliskiler sohbeti
              "rachel":   ("Chirp3-HD", "FEMALE", 1),
              "maya":     ("Chirp3-HD", "FEMALE", 3),
              "leo":      "en-US-Chirp3-HD-Algieba",

              # gramer sohbeti
              "mark":     ("Chirp3-HD", "MALE",   1),
              "laura":    ("Chirp3-HD", "FEMALE", 0),
          }

          ARA_MS      = 240    # cumleler arasi kisa nefes
          KONUSMA_MS  = 380    # konusmaci degisince
          ORNEKLEM    = 24000
          BITRATE     = "96k"

          kimlik = service_account.Credentials.from_service_account_file(
              '/tmp/gcp-key.json',
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          kimlik.refresh(Request())
          BAS = {"Authorization": "Bearer " + kimlik.token,
                 "Content-Type": "application/json; charset=utf-8"}

          # ---------- hesaptaki gercek ses listesi
          r = requests.get("https://texttospeech.googleapis.com/v1/voices?languageCode=en-US",
                           headers=BAS, timeout=60)
          r.raise_for_status()
          MEVCUT = r.json().get("voices", [])

          def havuz(kademe, cinsiyet):
              return sorted([v["name"] for v in MEVCUT
                             if kademe.lower() in v["name"].lower()
                             and v.get("ssmlGender") == cinsiyet])

          def coz(deger):
              if isinstance(deger, str):
                  return deger
              kademe, cinsiyet, sira = deger
              liste = havuz(kademe, cinsiyet)
              if not liste:
                  return "en-US-Studio-Q" if cinsiyet == "MALE" else "en-US-News-L"
              return liste[sira % len(liste)]

          COZUM = {k: coz(v) for k, v in SESLER.items()}
          print("Ses dagilimi:")
          for k, v in COZUM.items():
              print(f"  {k:10s} -> {v}")
          print()

          # ---------- STORY_DATA
          ham = open('index.html', encoding='utf-8', errors='replace').read()
          i = ham.find('const STORY_DATA = ')
          if i < 0:
              raise SystemExit('index.html icinde STORY_DATA bulunamadi')
          j = ham.find('\n', i)
          VERI = json.loads(ham[i + len('const STORY_DATA = '):j].rstrip().rstrip(';'))

          istenen = (os.environ.get('HIKAYE') or '').strip()
          hedefler = [s for s in VERI['stories'] if not istenen or s['id'] == istenen]
          if not hedefler:
              raise SystemExit(f"'{istenen}' adli hikaye yok")

          os.makedirs('ses', exist_ok=True)

          def pcm_uret(metin, ses_adi):
              def cagir(ayar):
                  return requests.post(
                      "https://texttospeech.googleapis.com/v1/text:synthesize",
                      headers=BAS,
                      json={"input": {"text": metin},
                            "voice": {"languageCode": "en-US", "name": ses_adi},
                            "audioConfig": ayar}, timeout=120)
              # Chirp3-HD hiz/perde kabul etmez; once hizli dene, olmazsa sade gonder
              ayar = {"audioEncoding": "LINEAR16", "sampleRateHertz": ORNEKLEM,
                      "speakingRate": 0.95}
              r = cagir(ayar)
              if r.status_code != 200:
                  r = cagir({"audioEncoding": "LINEAR16", "sampleRateHertz": ORNEKLEM})
              if r.status_code != 200:
                  raise SystemExit(f"TTS hatasi ({ses_adi}): {r.status_code} {r.text[:300]}")
              wav = base64.b64decode(r.json()["audioContent"])
              k = wav.find(b'data')
              return wav[k + 8:] if k > 0 else wav[44:]

          for st in hedefler:
              kid = st['id']
              print(f"=== {st['title']} ({kid}) ===")
              pcm = bytearray()
              kisa = b'\x00\x00' * int(ORNEKLEM * ARA_MS / 1000)
              uzun = b'\x00\x00' * int(ORNEKLEM * KONUSMA_MS / 1000)
              harita, harf, onceki = [], 0, None

              for pi, sayfa in enumerate(st['pages']):
                  for si, cumle in enumerate(sayfa):
                      metin = ''.join(t['t'] for t in cumle['en']).strip()
                      if not metin:
                          continue
                      kim = cumle.get('s') or 'anlatici'
                      if onceki is not None and kim != onceki:
                          pcm += uzun
                      onceki = kim
                      bas = len(pcm) / 2 / ORNEKLEM
                      pcm += pcm_uret(metin, COZUM.get(kim, COZUM['anlatici']))
                      bit = len(pcm) / 2 / ORNEKLEM
                      pcm += kisa
                      harita.append([pi, si, round(bas, 3), round(bit, 3)])
                      harf += len(metin)

              gecici = f'/tmp/{kid}.wav'
              with open(gecici, 'wb') as f:
                  n = len(pcm)
                  f.write(b'RIFF' + struct.pack('<I', 36 + n) + b'WAVEfmt ')
                  f.write(struct.pack('<IHHIIHH', 16, 1, 1, ORNEKLEM, ORNEKLEM * 2, 2, 16))
                  f.write(b'data' + struct.pack('<I', n) + bytes(pcm))

              mp3 = f'ses/{kid}.mp3'
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', gecici,
                              '-codec:a', 'libmp3lame', '-b:a', BITRATE, '-ac', '1', mp3],
                             check=True)
              json.dump({"id": kid, "sure": round(len(pcm)/2/ORNEKLEM, 2), "harita": harita},
                        open(f'ses/{kid}.json', 'w'), separators=(',', ':'))
              print(f"  -> {mp3}  {os.path.getsize(mp3)//1024} KB  ·  "
                    f"{len(harita)} cumle  ·  {harf} harf\n")
          PY

      - name: Depoya isle
        run: |
          git config user.name  "ses-botu"
          git config user.email "actions@github.com"
          git add ses
          git commit -m "Hikaye sesi uretildi (Chirp3-HD)" || echo "degisiklik yok"
          git push


name: OpenAI Ses Denemesi

on:
  workflow_dispatch:
    inputs:
      hikaye:
        description: 'Hangi hikaye? (örn. ai-podcast, nightshift, cry-wolf)'
        required: false
        default: 'ai-podcast'
      uslup:
        description: 'Anlatım üslubu (instructions)'
        required: false
        default: 'Warm, natural podcast delivery. Relaxed pace, clear pronunciation for English learners. Sound like a real person talking, not reading.'

permissions:
  contents: write

jobs:
  deneme:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Kutuphaneleri kur
        run: pip install --quiet requests

      - name: Sesleri uret
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIKAYE: ${{ inputs.hikaye }}
          USLUP: ${{ inputs.uslup }}
        run: |
          python3 - <<'PY'
          import json, os, struct, subprocess, requests

          ANAHTAR = os.environ.get('OPENAI_KEY', '').strip()
          if not ANAHTAR:
              raise SystemExit("OPENAI_API_KEY deposu bos. Settings > Secrets > Actions'a ekle.")

          MODEL  = "gpt-4o-mini-tts"
          # Karakter -> OpenAI sesi. marin/cedar kalite icin onerilenler.
          SESLER = {
              "anlatici": "cedar",
              "mia":      "coral",   "vance": "onyx",
              "emma":     "marin",   "sam":   "cedar",
              "alex":     "ash",     "sarah": "coral",  "david": "onyx",
              "rachel":   "shimmer", "maya":  "coral",  "leo":   "ash",
              "mark":     "cedar",   "laura": "marin",
          }
          ARA_MS, KONUSMA_MS, ORNEKLEM = 240, 380, 24000

          kid   = (os.environ.get('HIKAYE') or 'ai-podcast').strip()
          USLUP = os.environ.get('USLUP') or 'Natural, warm narration.'

          ham = open('index.html', encoding='utf-8', errors='replace').read()
          i = ham.find('const STORY_DATA = ')
          j = ham.find('\n', i)
          VERI = json.loads(ham[i + len('const STORY_DATA = '):j].rstrip().rstrip(';'))
          st = next((s for s in VERI['stories'] if s['id'] == kid), None)
          if not st:
              raise SystemExit(f"'{kid}' bulunamadi. Mevcutlar: "
                               + ", ".join(s['id'] for s in VERI['stories']))
          print(f"=== {st['title']} ({kid}) ===")

          def pcm_uret(metin, ses):
              r = requests.post(
                  "https://api.openai.com/v1/audio/speech",
                  headers={"Authorization": "Bearer " + ANAHTAR,
                           "Content-Type": "application/json"},
                  json={"model": MODEL, "voice": ses, "input": metin,
                        "instructions": USLUP,
                        "response_format": "pcm"},   # 24kHz 16-bit mono ham ses
                  timeout=120)
              if r.status_code != 200:
                  raise SystemExit(f"OpenAI hatasi ({ses}): {r.status_code} {r.text[:400]}")
              return r.content

          pcm = bytearray()
          kisa = b'\x00\x00' * int(ORNEKLEM * ARA_MS / 1000)
          uzun = b'\x00\x00' * int(ORNEKLEM * KONUSMA_MS / 1000)
          harita, harf, onceki = [], 0, None
          kullanilan = set()

          for pi, sayfa in enumerate(st['pages']):
              for si, cumle in enumerate(sayfa):
                  metin = ''.join(t['t'] for t in cumle['en']).strip()
                  if not metin:
                      continue
                  kim = cumle.get('s') or 'anlatici'
                  ses = SESLER.get(kim, SESLER['anlatici'])
                  kullanilan.add(f"{kim}={ses}")
                  if onceki is not None and kim != onceki:
                      pcm += uzun
                  onceki = kim
                  bas = len(pcm) / 2 / ORNEKLEM
                  pcm += pcm_uret(metin, ses)
                  bit = len(pcm) / 2 / ORNEKLEM
                  pcm += kisa
                  harita.append([pi, si, round(bas, 3), round(bit, 3)])
                  harf += len(metin)
              print(f"  sayfa {pi+1}: {len(sayfa)} cumle")

          print("  sesler:", ", ".join(sorted(kullanilan)))

          os.makedirs('ses-deneme', exist_ok=True)
          gec = '/tmp/openai.wav'
          with open(gec, 'wb') as f:
              n = len(pcm)
              f.write(b'RIFF' + struct.pack('<I', 36 + n) + b'WAVEfmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, ORNEKLEM, ORNEKLEM * 2, 2, 16))
              f.write(b'data' + struct.pack('<I', n) + bytes(pcm))
          mp3 = f'ses-deneme/{kid}-openai.mp3'
          subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', gec,
                          '-codec:a', 'libmp3lame', '-b:a', '96k', '-ac', '1', mp3],
                         check=True)
          # zaman haritasi da yazilir: begenilirse dogrudan ses/ klasorune tasinabilir
          json.dump({"id": kid, "sure": round(len(pcm)/2/ORNEKLEM, 2), "harita": harita},
                    open(f'ses-deneme/{kid}-openai.json', 'w'), separators=(',', ':'))

          sure = len(pcm) / 2 / ORNEKLEM
          print(f"\n-> {mp3}  {os.path.getsize(mp3)//1024} KB  ·  {sure:.0f} sn  ·  {harf} harf")

          h = ["<!DOCTYPE html><html lang='tr'><head><meta charset='utf-8'>",
               "<meta name='viewport' content='width=device-width,initial-scale=1'>",
               "<title>Ses Kar\u015f\u0131la\u015ft\u0131rma</title><style>",
               "body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 18px;background:#f6f8fc}",
               "h1{font-size:1.4rem;margin:0 0 6px}p.alt{color:#5c6780;font-size:.9rem;margin:0 0 20px}",
               ".k{background:#fff;border:1px solid #e4e6eb;border-radius:12px;padding:16px;margin-bottom:14px;",
               "display:flex;align-items:center;gap:12px}",
               ".k .ad{flex:1}.k b{display:block;font-size:1rem}.k span{font-size:.8rem;color:#8a8d91}",
               ".k a{background:#1877f2;color:#fff;text-decoration:none;border-radius:999px;padding:11px 18px;",
               "font-size:.9rem;font-weight:700}",
               "</style></head><body><h1>Ses Kar\u015f\u0131la\u015ft\u0131rma</h1>",
               f"<p class='alt'>{st['title']}</p>",
               f"<div class='k'><span class='ad'><b>OpenAI</b><span>{MODEL} \u00b7 \u00fcsl\u00fap y\u00f6nergeli</span></span>"
               f"<a href='/ses-deneme/{kid}-openai.mp3'>Dinle</a></div>",
               f"<div class='k'><span class='ad'><b>Google Chirp 3 HD</b><span>\u015fu an uygulamada</span></span>"
               f"<a href='/ses/{kid}.mp3'>Dinle</a></div>",
               "</body></html>"]
          open('ses-deneme/index.html', 'w', encoding='utf-8').write("\n".join(h))
          PY

      - name: Depoya isle
        run: |
          git config user.name  "ses-botu"
          git config user.email "actions@github.com"
          git add ses-deneme
          git commit -m "OpenAI ses denemesi" || echo "degisiklik yok"
          git push

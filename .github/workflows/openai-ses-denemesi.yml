name: OpenAI Ses Örnekleri

on:
  workflow_dispatch:
    inputs:
      uslup:
        description: 'Anlatım üslubu (instructions)'
        required: false
        default: 'Warm, natural podcast delivery. Relaxed pace, clear pronunciation for English learners. Sound like a real person talking, not reading.'
      metin:
        description: 'Örnek cümle'
        required: false
        default: "A year had passed since Sam's first day in the city. He was not the same nervous young man anymore."

permissions:
  contents: write

jobs:
  ornekler:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install --quiet requests

      - name: Ornekleri uret
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          USLUP: ${{ inputs.uslup }}
          METIN: ${{ inputs.metin }}
        run: |
          python3 - <<'PY'
          import os, requests

          ANAHTAR = os.environ.get('OPENAI_KEY', '').strip()
          if not ANAHTAR:
              raise SystemExit("OPENAI_API_KEY bos.")
          MODEL = "gpt-4o-mini-tts"
          USLUP = os.environ.get('USLUP') or 'Natural, warm narration.'
          METIN = os.environ.get('METIN') or "This is how the story will sound."

          # OpenAI'nin belgelenmis sesleri; marin ve cedar kalite icin onerilenler
          SESLER = [
              ("marin",   "kadin",  "kalite icin onerilen"),
              ("cedar",   "erkek",  "kalite icin onerilen"),
              ("alloy",   "notr",   ""),
              ("ash",     "erkek",  ""),
              ("ballad",  "erkek",  "anlatici tonu"),
              ("coral",   "kadin",  ""),
              ("echo",    "erkek",  ""),
              ("fable",   "notr",   "hikaye anlaticisi"),
              ("nova",    "kadin",  ""),
              ("onyx",    "erkek",  "derin"),
              ("sage",    "kadin",  ""),
              ("shimmer", "kadin",  ""),
              ("verse",   "erkek",  ""),
          ]

          os.makedirs('ses-ornek-openai', exist_ok=True)
          basarili = []

          for ses, cins, not_ in SESLER:
              yol = f'ses-ornek-openai/{ses}.mp3'
              if os.path.exists(yol) and os.path.getsize(yol) > 2000:
                  basarili.append((ses, cins, not_)); print(f"  {ses}: var, atlandi"); continue
              r = requests.post(
                  "https://api.openai.com/v1/audio/speech",
                  headers={"Authorization": "Bearer " + ANAHTAR,
                           "Content-Type": "application/json"},
                  json={"model": MODEL, "voice": ses, "input": METIN,
                        "instructions": USLUP, "response_format": "mp3"},
                  timeout=120)
              if r.status_code != 200:
                  print(f"  HATA {ses}: {r.status_code} {r.text[:200]}"); continue
              open(yol, 'wb').write(r.content)
              basarili.append((ses, cins, not_))
              print(f"  {ses}.mp3  ({len(r.content)//1024} KB, {cins})")

          if not basarili:
              raise SystemExit("Hicbir ses uretilemedi")

          h = ["<!DOCTYPE html><html lang='tr'><head><meta charset='utf-8'>",
               "<meta name='viewport' content='width=device-width,initial-scale=1'>",
               "<title>OpenAI Ses \u00d6rnekleri</title><style>",
               "body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 18px;background:#f6f8fc;color:#1c1e21}",
               "h1{font-size:1.4rem;margin:0 0 6px}p.alt{color:#5c6780;font-size:.88rem;margin:0 0 20px;line-height:1.55}",
               ".k{background:#fff;border:1px solid #e4e6eb;border-radius:12px;padding:13px 15px;margin-bottom:10px;",
               "display:flex;align-items:center;gap:12px}",
               ".k .ad{flex:1;min-width:0}.k b{display:block;font-size:1rem}",
               ".k span{font-size:.78rem;color:#8a8d91}",
               ".k a{flex:0 0 auto;background:#1877f2;color:#fff;text-decoration:none;border-radius:999px;",
               "padding:11px 18px;font-size:.9rem;font-weight:700}",
               "</style></head><body><h1>OpenAI Ses \u00d6rnekleri</h1>",
               f"<p class='alt'>Model: {MODEL}<br>\u00dcsl\u00fap: <i>{USLUP}</i></p>"]
          for ses, cins, not_ in basarili:
              etiket = cins + (" \u00b7 " + not_ if not_ else "")
              h.append(f"<div class='k'><span class='ad'><b>{ses}</b><span>{etiket}</span></span>"
                       f"<a href='/ses-ornek-openai/{ses}.mp3'>Dinle</a></div>")
          h.append("</body></html>")
          open('ses-ornek-openai/index.html', 'w', encoding='utf-8').write("\n".join(h))
          print(f"\nToplam {len(basarili)} ses \u00b7 {len(METIN)*len(basarili)} karakter")
          PY

      - name: Depoya isle
        run: |
          git config user.name  "ses-botu"
          git config user.email "actions@github.com"
          git add ses-ornek-openai
          git commit -m "OpenAI ses ornekleri" || echo "degisiklik yok"
          git push

name: Ses Örnekleri Üret

on:
  workflow_dispatch:

# depoya mp3 yazabilmek icin gerekli
permissions:
  contents: write

jobs:
  ornekler:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install --quiet google-auth requests

      - name: Kimlik dosyasini yaz
        env:
          ANAHTAR: ${{ secrets.GCP_TTS_KEY }}
        run: |
          printf '%s' "$ANAHTAR" > /tmp/gcp-key.json
          python3 -c "import json;d=json.load(open('/tmp/gcp-key.json'));print('kimlik OK:',d['client_email'])"

      - name: Örnek sesleri üret
        run: |
          python3 - <<'PY'
          import json, os, base64, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          kimlik = service_account.Credentials.from_service_account_file(
              '/tmp/gcp-key.json',
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          kimlik.refresh(Request())
          JETON = kimlik.token
          print('jeton alindi')

          METIN = ("A year had passed since Sam's first day in the city. "
                   "He was not the same nervous young man anymore.")

          SESLER = [
              ("wavenet-a", "en-US-Wavenet-A", "erkek"),
              ("wavenet-b", "en-US-Wavenet-B", "erkek"),
              ("wavenet-c", "en-US-Wavenet-C", "kadin"),
              ("wavenet-d", "en-US-Wavenet-D", "erkek"),
              ("wavenet-e", "en-US-Wavenet-E", "kadin"),
              ("wavenet-f", "en-US-Wavenet-F", "kadin"),
              ("wavenet-g", "en-US-Wavenet-G", "kadin"),
              ("wavenet-h", "en-US-Wavenet-H", "kadin"),
              ("wavenet-i", "en-US-Wavenet-I", "erkek"),
              ("wavenet-j", "en-US-Wavenet-J", "erkek"),
          ]

          os.makedirs("ses-ornek", exist_ok=True)
          basarili = []

          for dosya, ses, cinsiyet in SESLER:
              r = requests.post(
                  "https://texttospeech.googleapis.com/v1/text:synthesize",
                  headers={"Authorization": "Bearer " + JETON,
                           "Content-Type": "application/json; charset=utf-8"},
                  json={
                      "input": {"text": METIN},
                      "voice": {"languageCode": "en-US", "name": ses},
                      "audioConfig": {"audioEncoding": "MP3",
                                      "speakingRate": 0.92,
                                      "sampleRateHertz": 24000}
                  }, timeout=60)
              if r.status_code != 200:
                  print(f"  HATA {ses}: {r.status_code} {r.text[:300]}")
                  continue
              mp3 = base64.b64decode(r.json()["audioContent"])
              open(f"ses-ornek/{dosya}.mp3", "wb").write(mp3)
              print(f"  uretildi: {dosya}.mp3  ({cinsiyet}, {len(mp3)//1024} KB)")
              basarili.append((dosya, ses, cinsiyet))

          if not basarili:
              raise SystemExit("Hicbir ses uretilemedi")

          html = ["<!DOCTYPE html><html lang='tr'><head><meta charset='utf-8'>",
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>",
                  "<title>Ses Örnekleri</title><style>",
                  "body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 18px;background:#f6f8fc;color:#1c1e21}",
                  "h1{font-size:1.4rem;margin:0 0 6px}p.alt{color:#5c6780;font-size:.9rem;margin:0 0 22px}",
                  ".k{background:#fff;border:1px solid #e4e6eb;border-radius:12px;padding:14px 16px;margin-bottom:12px}",
                  ".k b{font-size:1.05rem}.k span{font-size:.8rem;color:#8a8d91;margin-left:8px}",
                  "audio{width:100%;margin-top:10px}",
                  "</style></head><body><h1>Ses Örnekleri</h1>",
                  "<p class='alt'>WaveNet · en-US · Hepsini dinleyip anlatıcı, Mia ve Bay Vance için birer ses seç.</p>"]
          for dosya, ses, cinsiyet in basarili:
              html.append(f"<div class='k'><b>{ses.split('-')[-1]}</b><span>{cinsiyet} · {ses}</span>"
                          f"<audio controls preload='none' src='{dosya}.mp3'></audio></div>")
          html.append("</body></html>")
          open("ses-ornek/index.html", "w", encoding="utf-8").write("\n".join(html))
          print("\nToplam karakter:", len(METIN) * len(basarili))
          PY

      - name: Depoya işle
        run: |
          git config user.name  "ses-botu"
          git config user.email "actions@github.com"
          git add ses-ornek
          git commit -m "Ses ornekleri uretildi" || echo "degisiklik yok"
          git push
